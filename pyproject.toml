[project]
name = "tax-doc-api"
version = "0.1.0"
description = "Tax document classification (tev1) and field extraction API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.143.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "registers>=7.5.0",
    "sqlmodel>=0.0.48",
    "typing-extensions>=4.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real Docling + Ollama models (skipped when Ollama or the models are missing)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
